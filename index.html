<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b18">
<meta name="description" content="A beautiful, searchable collection of C programming practicals with source code and sample outputs.">
<title>CodeLab • C Programming Practicals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #080a16;
  --panel: rgba(255,255,255,.075);
  --panel-strong: rgba(255,255,255,.115);
  --line: rgba(255,255,255,.14);
  --text: #f5f6ff;
  --muted: #a4abc9;
  --cyan: #6cf2ff;
  --violet: #b29bff;
  --pink: #ff8bd4;
  --green: #9dffcb;
  --radius: 24px;
  --shadow: 0 24px 80px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background: var(--bg);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  overflow-x: hidden;
}
body::before, body::after {
  content: '';
  position: fixed;
  width: 44vw;
  height: 44vw;
  min-width: 320px;
  min-height: 320px;
  border-radius: 50%;
  filter: blur(95px);
  opacity: .32;
  pointer-events: none;
  z-index: -2;
  animation: floatBlob 18s ease-in-out infinite alternate;
}
body::before { top: -12vw; left: -12vw; background: #5843ff; }
body::after { right: -14vw; top: 32vh; background: #ff3da8; animation-delay: -7s; }
@keyframes floatBlob {
  0% { transform: translate3d(0,0,0) scale(1); }
  50% { transform: translate3d(7vw,5vh,0) scale(1.15); }
  100% { transform: translate3d(-3vw,10vh,0) scale(.92); }
}
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes orbit {
  from { transform: rotate(0deg) translateX(8px) rotate(0deg); }
  to { transform: rotate(360deg) translateX(8px) rotate(-360deg); }
}
::selection { color: #090b18; background: var(--cyan); }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.page-shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; }
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 0; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: -.04em; font-size: 1.1rem; }
.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 15px; color: #09101d; background: linear-gradient(135deg, var(--cyan), var(--violet), var(--pink)); box-shadow: 0 0 28px rgba(108,242,255,.25); font-family: 'DM Mono', monospace; font-weight: 500; }
.brand span:last-child { color: #d8dcf8; }
.top-actions { display: flex; gap: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; color: var(--muted); font-size: .82rem; background: rgba(255,255,255,.045); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
.hero { position: relative; padding: clamp(30px, 6vw, 82px) 0 34px; }
.hero-card { position: relative; overflow: hidden; border-radius: 34px; padding: clamp(28px, 6vw, 74px); }
.hero-card::before { content: ''; position: absolute; width: 340px; height: 340px; right: -80px; top: -120px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; box-shadow: 0 0 0 32px rgba(255,255,255,.025), 0 0 0 64px rgba(255,255,255,.02); }
.hero-card::after { content: '</>'; position: absolute; right: clamp(24px, 7vw, 90px); bottom: 22px; font-family: 'DM Mono', monospace; font-size: clamp(3rem, 9vw, 8rem); color: rgba(255,255,255,.045); font-weight: 500; pointer-events: none; }
.eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--cyan); text-transform: uppercase; letter-spacing: .17em; font-size: .72rem; font-weight: 700; }
.eyebrow::before { content: ''; width: 22px; height: 1px; background: currentColor; }
.hero h1 { max-width: 800px; margin: 20px 0 18px; font-size: clamp(2.6rem, 7vw, 6.1rem); line-height: .99; letter-spacing: -.075em; }
.gradient-text { color: transparent; background: linear-gradient(90deg, #fff 0%, var(--cyan) 25%, var(--violet) 55%, var(--pink) 80%, #fff 100%); background-size: 250% auto; background-clip: text; -webkit-background-clip: text; animation: gradientFlow 8s ease infinite; }
.hero-copy { max-width: 610px; color: var(--muted); line-height: 1.75; font-size: clamp(.95rem, 1.5vw, 1.12rem); }
.hero-metrics { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
.metric { min-width: 124px; padding: 14px 17px; border-radius: 17px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.045); }
.metric strong { display: block; font-size: 1.45rem; letter-spacing: -.05em; }
.metric span { display: block; color: var(--muted); font-size: .76rem; margin-top: 3px; }
.toolbar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; margin: 22px 0 20px; }
.search-wrap { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 18px; border-radius: 18px; }
.search-icon { color: var(--cyan); font-size: 1.15rem; }
.search-wrap input { width: 100%; color: var(--text); border: 0; outline: 0; background: transparent; font-size: .98rem; }
.search-wrap input::placeholder { color: #777f9f; }
.toolbar-actions { display: flex; flex-wrap: wrap; gap: 9px; }
.action-btn { cursor: pointer; border: 1px solid var(--line); border-radius: 15px; padding: 13px 16px; background: rgba(255,255,255,.07); transition: transform .2s, background .2s, border-color .2s; }
.action-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.13); border-color: rgba(108,242,255,.4); }
.action-btn.primary { color: #08101b; font-weight: 700; border-color: transparent; background: linear-gradient(100deg, var(--cyan), #b7b1ff); }
.filters { display: flex; flex-wrap: wrap; gap: 9px; margin: 0 0 24px; }
.filter-btn { cursor: pointer; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; color: var(--muted); background: rgba(255,255,255,.04); font-size: .82rem; transition: all .2s; }
.filter-btn:hover, .filter-btn.active { color: var(--text); border-color: rgba(108,242,255,.45); background: rgba(108,242,255,.1); }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin: 36px 0 18px; }
.section-heading h2 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); letter-spacing: -.05em; }
.section-heading p { margin: 7px 0 0; color: var(--muted); font-size: .9rem; }
.results-count { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.program-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; padding-bottom: 70px; }
.program-card { min-width: 0; overflow: hidden; border-radius: 23px; animation: riseIn .45s both; transition: transform .25s, border-color .25s, background .25s; }
.program-card:hover { transform: translateY(-4px); border-color: rgba(178,155,255,.36); background-color: rgba(255,255,255,.035); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 20px 13px; }
.card-title-wrap { display: flex; gap: 13px; min-width: 0; }
.number-chip { flex: 0 0 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: var(--cyan); border: 1px solid rgba(108,242,255,.22); background: rgba(108,242,255,.08); font-family: 'DM Mono', monospace; font-size: .84rem; }
.card-title { margin: 1px 0 8px; font-size: 1.02rem; line-height: 1.35; letter-spacing: -.025em; }
.category { color: var(--muted); font-size: .74rem; }
.copy-btn { cursor: pointer; flex: 0 0 auto; padding: 8px 10px; border: 1px solid var(--line); border-radius: 11px; color: var(--muted); background: rgba(255,255,255,.035); font-size: .75rem; }
.copy-btn:hover { color: var(--cyan); }
.code-window { margin: 0 12px; border: 1px solid rgba(255,255,255,.09); border-radius: 15px; overflow: hidden; background: rgba(2,5,15,.58); }
.code-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; color: #858eae; border-bottom: 1px solid rgba(255,255,255,.07); font-family: 'DM Mono', monospace; font-size: .68rem; }
.traffic { display: flex; gap: 5px; }
.traffic i { width: 7px; height: 7px; display: block; border-radius: 50%; background: #ff7f9b; }
.traffic i:nth-child(2) { background: #ffd27d; }
.traffic i:nth-child(3) { background: #85f6c6; }
pre { margin: 0; padding: 16px; overflow: auto; max-height: 340px; color: #d9e5ff; font: .78rem/1.75 'DM Mono', monospace; tab-size: 4; white-space: pre; }
pre code { font: inherit; }
.card-foot { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; padding: 14px 16px 17px; }
.output-btn { cursor: pointer; border: 1px solid rgba(157,255,203,.22); border-radius: 12px; padding: 10px 13px; color: var(--green); background: rgba(157,255,203,.075); font-size: .8rem; transition: all .2s; }
.output-btn:hover { background: rgba(157,255,203,.14); }
.output-panel { display: none; width: 100%; margin-top: 3px; padding: 13px 14px; border: 1px solid rgba(157,255,203,.15); border-radius: 13px; background: rgba(157,255,203,.045); }
.output-panel.open { display: block; animation: riseIn .25s both; }
.output-label { margin-bottom: 8px; color: var(--green); text-transform: uppercase; letter-spacing: .12em; font-size: .65rem; font-weight: 700; }
.output-panel pre { max-height: 220px; padding: 0; color: #c9f9de; font-size: .75rem; }
.note { color: var(--muted); font-size: .73rem; margin-left: auto; }
.empty-state { display: none; text-align: center; padding: 54px 20px; border-radius: 24px; color: var(--muted); }
.empty-state.show { display: block; }
.empty-icon { font-size: 2rem; margin-bottom: 12px; }
.footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 34px; border-top: 1px solid rgba(255,255,255,.09); color: var(--muted); font-size: .78rem; }
.footer strong { color: var(--text); }
.back-top { color: var(--cyan); }
.toast { position: fixed; bottom: 22px; left: 50%; z-index: 20; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 12px 17px; border: 1px solid var(--line); border-radius: 14px; background: rgba(12,16,34,.9); box-shadow: var(--shadow); transition: all .25s; font-size: .85rem; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal-backdrop { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; padding: 20px; background: rgba(2,4,12,.72); backdrop-filter: blur(12px); }
.modal-backdrop.open { display: flex; }
.modal { width: min(580px,100%); padding: 25px; border-radius: 24px; }
.modal h3 { margin: 0 0 12px; font-size: 1.35rem; }
.modal p, .modal li { color: var(--muted); line-height: 1.7; }
.modal-close { float: right; cursor: pointer; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: rgba(255,255,255,.06); }
@media (max-width: 900px) {
  .toolbar { grid-template-columns: 1fr; }
  .toolbar-actions { justify-content: flex-start; }
}
@media (max-width: 680px) {
  .page-shell { width: min(100% - 24px, 1440px); }
  .topbar { padding: 15px 0; }
  .top-actions .pill:nth-child(1) { display: none; }
  .hero { padding-top: 18px; }
  .hero-card { border-radius: 25px; }
  .hero-card::after { right: 20px; bottom: 12px; }
  .program-grid { grid-template-columns: 1fr; gap: 13px; }
  .section-heading { align-items: flex-start; flex-direction: column; }
  .card-head { padding: 16px 15px 12px; }
  .code-window { margin: 0 9px; }
  pre { font-size: .72rem; }
  .card-foot { padding: 12px; }
  .metric { min-width: 105px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
